name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: unit-and-build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobtrackr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      # Un cambio que toca los dos repos (p. ej. el extractor de ofertas) usa la
      # misma rama en ambos: si el backend tiene una rama con el nombre de la de
      # este PR, los e2e corren contra esa; si no, contra main. El nombre de la
      # rama va por env (no interpolado en el script) para evitar inyección.
      - name: Elegir rama del backend
        id: backend-ref
        env:
          RAMA_PR: ${{ github.head_ref }}
        run: |
          if [ -n "$RAMA_PR" ] && git ls-remote --exit-code --heads https://github.com/nankuphoto-sys/jobtrackr-backend.git "refs/heads/$RAMA_PR" > /dev/null; then
            echo "ref=$RAMA_PR" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "Backend: $(tail -1 "$GITHUB_OUTPUT")"

      # El backend vive en un repo separado (jobtrackr-backend). Es público,
      # así que se puede clonar sin ningún token adicional.
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: nankuphoto-sys/jobtrackr-backend
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Apply backend migrations against a real Postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobtrackr?schema=public
        run: npx prisma migrate deploy

      - name: Start backend and wait for /health
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobtrackr?schema=public
          JWT_SECRET: ci-only-placeholder-secret-not-for-production
          PORT: 4000
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && break
            sleep 1
          done
          curl -sf http://localhost:4000/health | grep -q '"status":"ok"'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run e2e tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
